*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--ground)}
body{color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5}
body::after{content:"";position:fixed;right:-40px;bottom:-50px;width:320px;height:420px;background:var(--ink);opacity:.035;pointer-events:none;-webkit-mask:var(--lion) no-repeat center/contain;mask:var(--lion) no-repeat center/contain;z-index:0}
.wrap{position:relative;z-index:1;max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:#fff}
.bar .wrap{display:flex;align-items:center;gap:14px;padding-block:10px}
.bar img{height:38px;width:auto;display:block}
.bar .sep{width:1px;height:26px;background:var(--line)}
.bar .app{font-weight:600;font-size:1.02rem}
.bar .app small{display:block;font-weight:400;font-size:.8rem;color:var(--ink-mute);line-height:1.2}
.bar .sp{flex:1}
main .wrap{padding-block:22px 48px;display:grid;gap:22px}
.blk{background:var(--card);border-radius:var(--r);border:1px solid var(--line);padding:18px 20px;min-width:0}
.blk-head{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.num{flex:none;width:24px;height:24px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-weight:700;font-size:.8rem}
.blk-head h2{font-size:1.05rem;font-weight:600;margin:0}
.blk-head .sp{flex:1}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}
.drop{position:relative;display:flex;gap:14px;align-items:center;cursor:pointer;border:1.5px dashed var(--rule);border-radius:12px;padding:14px 16px;background:var(--row);transition:background .15s,border-color .15s}
.drop:hover,.drop.over{background:#eef2f0;border-color:var(--green)}
.drop.over{border-style:solid}
.drop input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%}
.drop:focus-within{outline:2px solid var(--vivid);outline-offset:2px}
.drop .ico{flex:none;width:38px;height:38px;border-radius:10px;background:#fff;border:1px solid var(--line);display:grid;place-items:center;color:var(--green)}
.drop h3{font-size:.98rem;font-weight:600;margin:0}
.hint{color:var(--ink-mute);font-size:.86rem;margin:1px 0 0}
.tag{display:inline-block;font-size:.76rem;font-weight:600;padding:2px 10px;border-radius:999px;background:#fff;border:1px solid var(--rule);margin-top:6px}
.pill{font:600 .9rem var(--body);padding:8px 16px;border:1px solid var(--rule);background:#fff;color:var(--ink);cursor:pointer;border-radius:999px;white-space:nowrap}
.pill:hover{background:var(--row)}
.pill.vivid{background:var(--vivid);border-color:var(--vivid);color:#fff;padding:10px 20px;box-shadow:0 2px 8px rgba(0,119,47,.25)}
.pill.vivid:hover{background:var(--vivid-hover)}
.pill:focus-visible{outline:2px solid var(--vivid);outline-offset:2px}
.priv{display:flex;gap:7px;align-items:center;color:var(--ink-mute);font-size:.84rem}
#read{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0}
#read .col{padding:0 18px;border-left:1px solid var(--line);min-width:0}
#read .col:first-child{padding-left:0;border-left:0}
@media (max-width:980px){#read{grid-template-columns:repeat(2,minmax(0,1fr));row-gap:18px}#read .col:nth-child(3){padding-left:0;border-left:0}}
@media (max-width:560px){#read{grid-template-columns:minmax(0,1fr)}#read .col{padding-left:0;border-left:0}}
.grp{font-size:.7rem;font-weight:700;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-mute);margin:0 0 8px}
.kv{display:grid;grid-template-columns:72px minmax(0,1fr);gap:8px;font-size:.88rem;padding:3px 0}
.kv span{color:var(--ink-mute)} .kv b{font-weight:500;overflow-wrap:anywhere} .kv em{color:var(--ink-mute);font-style:normal}
.r{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;font-size:.88rem;padding:4px 0}
.r .v{color:var(--ink-mute);font-size:.76rem;display:flex;align-items:center;gap:6px}
.bars{display:flex;gap:2px}.bars i{width:11px;height:6px;border-radius:3px;background:var(--line)}.bars i.on{background:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{font-size:.82rem;padding:2px 9px;border-radius:999px;background:var(--row);border:1px solid var(--line)}
.alerts{display:grid;gap:6px;margin-top:14px}
.alerts:empty{display:none}
.alert{font-size:.85rem;background:var(--terra-tint);color:var(--terra);padding:7px 12px;border-radius:10px}
.paper{background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 1px 3px rgba(14,34,47,.06);max-width:820px;margin:0 auto;padding:clamp(20px,4vw,48px) clamp(18px,5vw,64px)}
.paper .dt{font-family:var(--display);font-size:1.45rem;margin:0}
.paper .sub{color:var(--ink-mute);font-size:.86rem;margin:2px 0 18px}
#out{min-height:420px;outline:none;font-size:1rem;line-height:1.65;white-space:pre-wrap;overflow-wrap:anywhere}
#out:focus-visible{box-shadow:0 0 0 2px var(--line);border-radius:6px}
#out .ph{background:var(--ph);border-radius:4px;padding:0 3px}
.legend{display:inline-flex;align-items:center;gap:6px;font-size:.8rem;color:var(--ink-mute)}
.legend i{width:22px;height:12px;border-radius:3px;background:var(--ph)}
.msg{font-size:.86rem;font-weight:600;color:var(--ink-soft)}
.motif{display:inline-flex;align-items:center;gap:7px;font-size:.84rem;font-weight:600;background:var(--row);border:1px solid var(--line);border-radius:999px;padding:3px 11px}
.motif .d{width:8px;height:8px;border-radius:50%;background:var(--vivid)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

async function lireFormulaire(buf){
  const doc = await PDFLib.PDFDocument.load(buf, {ignoreEncryption:true}), out = {};
  for (const f of doc.getForm().getFields()){
    const n = f.getName();
    try{
      if (f instanceof PDFLib.PDFTextField) out[n] = (f.getText()||"").trim();
      else if (f instanceof PDFLib.PDFCheckBox) out[n] = f.isChecked();
      else if (f instanceof PDFLib.PDFRadioGroup) out[n] = f.getSelected()||"";
      if (n === "DATE_DEBUT" || n === "DATE_FIN") out[n] = String(out[n]||"").trim();
      else if (f instanceof PDFLib.PDFDropdown){ const v = (f.getSelected()||[])[0]||""; out[n] = /^Choisir/.test(v) ? "" : v; }
    }catch(e){}
  }
  if (!("SF_QUALITE" in out)) throw new Error("champs");
  return out;
}
function lireBibliotheque(buf){
  const wb = XLSX.read(buf, {type:"array"});
  if (!wb.Sheets.Phrases || !wb.Sheets.Adjectifs) throw new Error("onglets");
  const lire = n => wb.Sheets[n] ? XLSX.utils.sheet_to_json(wb.Sheets[n],{defval:""}) : [];
  return {phrases:lire("Phrases"), adjectifs:lire("Adjectifs"), services:lire("Services"), metiers:lire("Métiers"), cahiers:lire("Cahiers des charges")};
}

const norm = t => String(t||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[·.\-]/g,"").replace(/\s+/g," ").trim().toLowerCase();
function serviceTexte(){
  if (!rep.SERVICE) return "[du service]";
  const r = (lib.services||[]).find(x => norm(x.Service) === norm(rep.SERVICE));
  return r && r["Dans le texte"] ? r["Dans le texte"] : "du service " + rep.SERVICE;
}
// Le métier tapé dans le formulaire est reconnu sous sa forme épicène, masculine ou féminine
const normM = t => norm(String(t||"").replace(/[’']/g," ").replace(/&/g," et ")).split(" ").filter(w => w && !["d","de","du","des","la","le","l"].includes(w)).join(" ");
function codeService(){
  const r = (lib.services||[]).find(x => norm(x.Service) === norm(rep.SERVICE));
  return r ? String(r.Code||"").trim() : "";
}
function metierEpicene(){
  const f = normM(rep.FONCTION); if (!f) return "";
  const code = codeService();
  const ok = m => [m["Métier"], m.Masculin, m["Féminin"]].some(x => normM(x) === f);
  const m = (lib.metiers||[]).find(m => ok(m) && (!code || !m.Service || norm(m.Service) === norm(code))) || (lib.metiers||[]).find(ok);
  return m ? m["Métier"] : rep.FONCTION;
}
function tachesDuMetier(){
  const metier = normM(metierEpicene()), code = norm(codeService()), svc = norm(rep.SERVICE);
  return (lib.cahiers||[]).filter(r => normM(r["Métier"]) === metier &&
      (!norm(r.Service) || norm(r.Service) === code || norm(r.Service) === svc))
    .map(r => String(r["Tâche"]||"").trim()).filter(Boolean);
}

const MOIS = ["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"];
function dateLongue(t){
  const m = String(t).trim().match(/^(\d{1,2})[.\/\-\s](\d{1,2})[.\/\-\s](\d{2}|\d{4})$/);
  if (!m) return t;
  const j = +m[1], mo = +m[2], a = m[3].length === 2 ? 2000 + +m[3] : +m[3];
  if (j < 1 || j > 31 || mo < 1 || mo > 12) return t;
  return (j === 1 ? "1er" : String(j)) + " " + MOIS[mo - 1] + " " + a;
}

  let t;
  const rempl = s => { t = String(s).replaceAll("{Civ}", fem ? "Madame" : "Monsieur")
    .replaceAll("{Service}", serviceTexte()).replaceAll("{Fonction}", rep.FONCTION || "[métier]")
    .replaceAll("{Il}", fem?"Elle":"Il").replaceAll("{il}", fem?"elle":"il").replaceAll("{le}", fem?"la":"le")
    .replaceAll("{e}", fem?"e":"").replaceAll("{adjectifs}", liste);
    if (rep.DATE_DEBUT) t = t.replaceAll("{Debut}", dateLongue(rep.DATE_DEBUT));
    if (rep.DATE_FIN) t = t.replaceAll("{Fin}", dateLongue(rep.DATE_FIN));
    for (const [k,l] of Object.entries(A_COMPLETER)) t = t.replaceAll(`{${k}}`, `[${l}]`);
    return t.replace(/\[Prénom\] \[Nom\]/g, "[Prénom Nom]"); };
  const parMotif = partie => { const ps = rows.filter(r => r.Partie === partie); return ps.find(r => r.Code === "MOTIF_" + motif) || ps.find(r => r.Code === "TOUS"); };
  const notes = partie => { const ps = rows.filter(r => r.Partie === partie);
    return [...new Set(ps.map(r => r.Code))].map(code => {
      const n = String(rep[code]||""), lab = ps.find(r => r.Code === code).Rubrique;
      if (!n){ alerts.push(`« ${lab} » sans réponse : rubrique ignorée.`); return ""; }
      const r = ps.find(r => r.Code === code && String(r.Niveau) === n);
      if (!r){ alerts.push(`Pas de phrase pour « ${lab} », niveau ${n}.`); return ""; }
      return rempl(r.Formulation); }).filter(Boolean).join(" "); };
  const ouv = parMotif("Ouverture");
  const qual = adjs.length ? rows.filter(r => r.Partie === "Qualités").map(r => rempl(r.Formulation)).join(" ") : "";
  if (!adjs.length) alerts.push("Aucun adjectif coché : phrase des qualités omise.");
  const clo = motif ? rows.find(r => r.Partie === "Clôture" && r.Code === "MOTIF_" + motif) : null;
  const avis = rows.filter(r => r.Partie === "Avis" && rep[r.Code]);
  if (inter && avis.length) alerts.push("Avis de départ cochés sur un certificat intermédiaire : ignorés.");
  const voeux = parMotif("Vœux");
  const fin = [clo && rempl(clo.Formulation), ...(inter ? [] : [...avis.map(r => rempl(r.Formulation)), voeux && rempl(voeux.Formulation)])].filter(Boolean).join(" ");
  const taux = parMotif("Taux"), taches = parMotif("Tâches");
  const cdc = tachesDuMetier();
  if (taches && rep.FONCTION && !cdc.length) alerts.push(`Pas de cahier des charges pour « ${rep.FONCTION} » : tâches à compléter dans le Word.`);
  const paras = [ouv ? rempl(ouv.Formulation) : "",
    taux ? rempl(taux.Formulation) + "\n[du JJ.MM.AAAA au JJ.MM.AAAA à …%]" : "",
    taches ? rempl(taches.Formulation) + "\n" + (cdc.length ? cdc : ["[Tâche]","[Tâche]","[Tâche]"]).map(t => "• " + t).join("\n") : "",
    notes("Savoir-faire"), [notes("Savoir-être"), qual].filter(Boolean).join(" "), fin].filter(Boolean);
  return {titre: "Certificat de travail", paras, alerts, rows, fonction, adjs, motif, avis};
}

function rendre(){
  const a = assembler();
  if (!edited) $("out").innerHTML = a.paras.map(p => esc(p).replace(/\[[^\]]+\]/g, m => `<span class="ph">${m}</span>`)).join("\n\n");
  $("docTitle").textContent = a.titre;
  $("docSub").textContent = [rep.FONCTION, rep.SERVICE].filter(Boolean).join(" · ");
  $("motifTxt").textContent = MOTIFS[a.motif] || "Motif non coché";
  const rub = partie => { const ps = a.rows.filter(r => r.Partie === partie);
    return [...new Set(ps.map(r => r.Code))].map(code => { const n = +rep[code]||0, lab = ps.find(r => r.Code === code).Rubrique;
      return `<div class="r"><span class="n">${esc(lab)}</span><span class="v">${n?ECHELLE[n]:"—"}<span class="bars">${[1,2,3,4].map(i=>`<i class="${i<=n?"on":""}"></i>`).join("")}</span></span></div>`; }).join(""); };
  const kv = (k, v) => `<div class="kv"><span>${k}</span><b>${v ? esc(v) : "<em>—</em>"}</b></div>`;
  $("read").innerHTML = `
    <div class="col"><div class="grp">Poste et mission</div>
      ${kv("Service", rep.SERVICE)}${kv("Métier", rep.FONCTION)}${kv("Sexe", rep.SEXE === "F" ? "Femme" : rep.SEXE === "H" ? "Homme" : "")}
      ${kv("Mission", rep.DATE_DEBUT ? "du " + dateLongue(rep.DATE_DEBUT) + (rep.DATE_FIN ? " au " + dateLongue(rep.DATE_FIN) : ", en cours") : "")}${kv("Motif", MOTIFS[a.motif])}</div>
    <div class="col"><div class="grp">Savoir-faire</div>${rub("Savoir-faire")}</div>
    <div class="col"><div class="grp">Savoir-être</div>${rub("Savoir-être")}</div>
    <div class="col"><div class="grp">Qualités</div><div class="chips">${a.adjs.map(x=>`<span class="chip">${esc(fem ? x["Féminin"] : x.Masculin)}</span>`).join("") || "<span class='chip'>Aucune</span>"}</div>
      <div class="grp" style="margin-top:14px">Avis suite au départ</div><div class="chips">${a.avis.map(r=>`<span class="chip">${esc(r.Rubrique)}</span>`).join("") || "<span class='chip'>Aucun</span>"}</div></div>`;
  $("alerts").innerHTML = a.alerts.map(x => `<div class="alert">${esc(x)}</div>`).join("");
}

// ---- Word : le modèle de la Ville, dont le corps est remplacé par le texte (une ligne = un paragraphe)
function b64ToBytes(b){ const s = atob(b), u = new Uint8Array(s.length); for (let i=0;i<s.length;i++) u[i]=s.charCodeAt(i); return u; }
const xesc = t => t.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const RPR_HL = XP.RPR.replace("</w:rPr>", '<w:highlight w:val="lightGray"/></w:rPr>');
const runsXml = t => t.split(/(\[[^\]]+\])/).filter(Boolean).map(x => `<w:r>${/^\[.*\]$/.test(x) ? RPR_HL : XP.RPR}<w:t xml:space="preserve">${xesc(x)}</w:t></w:r>`).join("");
function corpsXml(texte){
  const out = []; let blank = false;
  for (const raw of texte.replace(/\r/g,"").split("\n")){
    const l = raw.trim();
    if (!l){ if (out.length && !blank) out.push(XP.EMPTY); blank = true; continue; }
    blank = false;
    out.push(/^[•\-–]\s*/.test(l) ? `<w:p>${XP.P_BULLET}${runsXml(l.replace(/^[•\-–]\s*/,""))}</w:p>` : `<w:p>${XP.P_BODY}${runsXml(l)}</w:p>`);
  }
  while (out.length && out.at(-1) === XP.EMPTY) out.pop();
  return out.join("");
}
function remplacerParagraphe(xml, balise, contenu){
  const i = xml.indexOf(balise); if (i < 0) return xml;
  const a = xml.lastIndexOf("<w:p>", i), b = xml.indexOf("</w:p>", i) + 6;
  return xml.slice(0, a) + contenu + xml.slice(b);
}
async function construireWord(){
  const zip = await JSZip.loadAsync(b64ToBytes(MODELE));
  let xml = await zip.file("word/document.xml").async("string");
  xml = remplacerParagraphe(xml, "{{CORPS}}", corpsXml($("out").innerText));
  const mois = new Date().toLocaleDateString("fr-CH", {month:"long", year:"numeric"});
  xml = xml.replace("{{DATE}}", xesc("Carouge, " + mois));
  zip.file("word/document.xml", xml);
  return zip.generateAsync({type:"blob", mimeType:"application/vnd.openxmlformats-officedocument.wordprocessingml.document"});
}
const msg = t => { $("msg").textContent = t; if (t) setTimeout(() => { if ($("msg").textContent === t) $("msg").textContent = ""; }, 3500); };
let downloads = null;
if (window.claude?.use) window.claude.use("downloads").then(d => downloads = d).catch(() => {});
$("word").addEventListener("click", async () => {
  if (typeof JSZip === "undefined"){ msg("Outil Word non chargé, vérifiez la connexion."); return; }
  try{
    const blob = await construireWord(), filename = (assembler().motif === "INTERMEDIAIRE" ? "Certificat_Travail_Intermediaire" : "Certificat_Travail") + ".docx";
    if (downloads){ try{ await downloads.save({filename, data:blob}); msg("Téléchargé"); }catch(e){ msg(e && e.code === "declined" ? "Téléchargement annulé" : "Téléchargement impossible ici"); } }
    else { const url = URL.createObjectURL(blob), l = document.createElement("a"); l.href = url; l.download = filename; document.body.appendChild(l); l.click(); l.remove(); setTimeout(() => URL.revokeObjectURL(url), 4000); msg("Téléchargé"); }
  }catch(e){ msg("Le Word n'a pas pu être généré."); }
});
$("copy").addEventListener("click", () => { const t = $("out").innerText;
  if (navigator.clipboard) navigator.clipboard.writeText(t).then(() => msg("Texte copié")).catch(() => msg("Sélectionnez le texte pour le copier")); });
$("out").addEventListener("input", () => edited = true);

async function charger(file){
  if (!file) return;
  const isPdf = /\.pdf$/i.test(file.name), isXl = /\.xlsx?$/i.test(file.name);
  if (!isPdf && !isXl){ msg("Déposez un PDF (questionnaire) ou un Excel (bibliothèque)."); return; }
  const buf = await file.arrayBuffer();
  try{
    if (isPdf){ if (typeof PDFLib === "undefined") throw new Error("lib"); rep = await lireFormulaire(buf); isExample = false; $("stForm").textContent = file.name; $("stForm").hidden = false; }
    else { if (typeof XLSX === "undefined") throw new Error("lib"); lib = lireBibliotheque(buf); $("stLib").textContent = file.name; $("stLib").hidden = false; }
    edited = false; rendre();
  }catch(e){ msg(e.message === "lib" ? "Outil de lecture non chargé." : isPdf ? "Ce PDF n'est pas le questionnaire." : "Onglets Phrases et Adjectifs introuvables."); }
}
$("fileForm").addEventListener("change", e => { charger(e.target.files[0]); e.target.value = ""; });
$("fileLib").addEventListener("change", e => { charger(e.target.files[0]); e.target.value = ""; });
document.querySelectorAll(".drop").forEach(z => {
  ["dragenter","dragover"].forEach(ev => z.addEventListener(ev, e => { e.preventDefault(); z.classList.add("over"); }));
  ["dragleave","drop"].forEach(ev => z.addEventListener(ev, e => { if (ev === "dragleave" && z.contains(e.relatedTarget)) return; e.preventDefault(); z.classList.remove("over"); }));
  z.addEventListener("drop", e => [...e.dataTransfer.files].forEach(charger));
});
$("reset").addEventListener("click", () => { rep = EXEMPLE; lib = LIB_DEFAULT; fem = true; isExample = true; edited = false;
  $("stForm").hidden = true; $("stLib").hidden = true; rendre(); });
rendre();
</script>
